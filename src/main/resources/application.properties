server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/incidentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:incident_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:incident_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# --- Actuator / Monitoring ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always